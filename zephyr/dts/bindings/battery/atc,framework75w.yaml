description: "ATC Framework Laptop"
compatible: "atc,framework75w"

include: battery-smart.yaml

properties:
   enum-name:
      type: string
      default: "atc,framework75w"

   # Fuel gauge
   manuf_name:
      default: "ATC"
   device_name:
      default: "FRANEDA"
   ship_mode_reg_addr:
      default: 0x00
   ship_mode_reg_data:
      default: [ 0x0010, 0x0010 ]
   fet_mfgacc_support:
      default: 1
   fet_reg_mask:
      default: 0x0002
   fet_disconnect_val:
      default: 0x0000
   fet_cfet_mask:
      default: 0x0004
   fet_cfet_off_val:
      default: 0x0000

   # Battery info
   voltage_max:
      default: 18040
   voltage_normal:
      default: 15640
   voltage_min:
      default: 12000
   precharge_current:
      default: 256
   start_charging_min_c:
      default: 0
   start_charging_max_c:
      default: 45
   charging_min_c:
      default: 0
   charging_max_c:
      default: 55
   discharging_min_c:
      default: 0
   discharging_max_c:
      default: 70
