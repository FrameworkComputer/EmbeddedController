description: "ATL AP25AAP"
compatible: "atl,ap25aap"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "atl,ap25aap"

  # Fuel Gauge
  manuf_name:
    default: "ATL KT0040A001"
  device_name:
    default: "AP25AAP"
  ship_mode_reg_addr:
    default: 0x00
  ship_mode_reg_data:
    default: [0x0010, 0x0010]
  # Manufacturer Access 0x00
  # b15: D-FET
  # b14: C-FET
  flags:
    default: 0x00
  fet_reg_addr:
    default: 0x0
  fet_reg_mask:
    default: 0x8000
  fet_disconnect_val:
    default: 0x0000
  fet_cfet_mask:
    default: 0x4000
  fet_cfet_off_val:
    default: 0x0000

  # Battery info
  voltage_max:
    default: 17920
  voltage_normal:
    default: 15560
  voltage_min:
    default: 12000
  precharge_current:
    default: 256
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 50
  charging_min_c:
    default: 0
  charging_max_c:
    default: 60
  discharging_min_c:
    default: -20
  discharging_max_c:
    default: 75
