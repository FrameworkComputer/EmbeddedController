description: "ATL L25N4PK5"
compatible: "atl,l25N4pk5"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "atl,l25n4pk5"

  # Fuel gauge
  manuf_name:
    default: "atl"
  device_name:
    default: "L25n4pk5"
  ship_mode_reg_addr:
    default: 0x34
  ship_mode_reg_data:
    default: [0x0000, 0x1000]
  flags:
    default: 0
  fet_reg_addr:
    default: 0x00
  fet_reg_mask:
    default: 0x0018
  fet_disconnect_val:
    default: 0x0000

  # Battery info
  voltage_max:
    default: 17800
  voltage_normal:
    default: 15480
  voltage_min:
    default: 12000
  precharge_current:
    default: 226
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 50
  charging_min_c:
    default: 0
  charging_max_c:
    default: 60
  discharging_min_c:
    default: -20
  discharging_max_c:
    default: 60
