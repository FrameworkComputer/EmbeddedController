description: "SMP 333-1D-2D-A"
compatible: "smp,333-1d-2d-a"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "smp,333-1d-2d-a"

  # Fuel gauge
  manuf_name:
    default: "333-1D-2D-A"
  device_name:
    default: "GM04070XL"
  ship_mode_reg_addr:
    default: 0x00
  ship_mode_reg_data:
    default: [0x0010, 0x0010]
  flags:
    default: 0x04
  fet_reg_addr:
    default: 0x0
  fet_reg_mask:
    default: 0x0006
  fet_disconnect_val:
    default: 0x0
  fet_cfet_mask:
    default: 0x0004
  fet_cfet_off_val:
    default: 0x0

  # Battery info
  voltage_max:
    default: 9020
  voltage_normal:
    default: 7800
  voltage_min:
    default: 6000
  precharge_current:
    default: 256
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 45
  charging_min_c:
    default: 0
  charging_max_c:
    default: 50
  discharging_min_c:
    default: -10
  discharging_max_c:
    default: 65
