description: "SMP L26M2PK1"
compatible: "smp,l26m2pk1"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "smp,l26m2pk1"

  # Fuel gauge
  manuf_name:
    default: "SMP"
  device_name:
    default: "L26M2PK1"
  ship_mode_reg_addr:
    default: 0x34
  ship_mode_reg_data:
    default: [0x0000, 0x1000]
  flags:
    default: 0
  fet_reg_addr:
    default: 0x00
  fet_reg_mask:
    default: 0x0010
  fet_disconnect_val:
    default: 0x0000
  fet_cfet_mask:
    default: 0x0008
  fet_cfet_off_val:
    default: 0x0000

  # Battery info
  voltage_max:
    default: 8800
  voltage_normal:
    default: 7540
  voltage_min:
    default: 6000
  precharge_current:
    default: 223
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 50
  charging_min_c:
    default: 0
  charging_max_c:
    default: 60
  discharging_min_c:
    default: -20
  discharging_max_c:
    default: 60
