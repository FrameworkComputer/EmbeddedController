description: "SMP SMP-ATL-4.550"
compatible: "smp,smp-atl-4-550"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "smp,smp-atl-4-550"

  # TI BQ41390 Fuel gauge
  manuf_name:
    default: "SMP-ATL4.550"
  device_name:
    default: "DELL RG0NJYMD"
  ship_mode_reg_addr:
    default: 0x00
  ship_mode_reg_data:
    default: [0x0010, 0x0010]
  flags:
    default: 0x0000
  fet_reg_addr:
    default: 0x0000
  fet_reg_mask:
    default: 0xC000
  fet_disconnect_val:
    default: 0x8000
  fet_cfet_mask:
    default: 0xC000
  fet_cfet_off_val:
    default: 0x4000


  # Battery info
  voltage_max:
    default: 13440
  voltage_normal:
    default: 12240
  voltage_min:
    default: 9000
  precharge_current:
    default: 256
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 50
  charging_min_c:
    default: 0
  charging_max_c:
    default: 50
  discharging_min_c:
    default: -17
  discharging_max_c:
    default: 70
