include: base.yaml

description: Centralized UFSC policy configuration container

compatible: "cros-ec,cbi-ufsc-policies"

child-binding:
  description: Individual feature policy
  properties:
    enable-value:
      type: phandle
      required: true
      description: Phandle to the UFSC value node that enables this feature.
