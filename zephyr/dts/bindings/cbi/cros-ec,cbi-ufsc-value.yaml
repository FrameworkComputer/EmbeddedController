include: base.yaml

description: |
  A possible value for a CBI UFSC field.
  It must be defined as a child of a UFSC field node (which is itself
  a child of the "cros-ec,cbi-ufsc" node).

compatible: "cros-ec,cbi-ufsc-value"

properties:
  value:
    type: int
    required: true
    description:
      The integer value that represents this component choice. This value
      is compared against the bits read from the CBI. Must fit within the
      size defined by the parent field.
  enum-name:
    type: string
    required: false
    description:
      Optional name used to generate a descriptive C enum for this specific
      value.
  default:
    type: boolean
    required: false
    description:
      If set, this value will be the default for its parent field if the
      UFSC data is invalid or unavailable. Only one default is allowed
      per field.
