description: AMD Phoenix FP7r2, Power Signal List
compatible: "amd,fwk-phoenix-fp7r2-power-signal-list"

include: power-signal-list.yaml

properties:
  power-signals-required:
    default: 4

child-binding:
  properties:
    power-enum-name:
      enum:
        - X86_3VALW_PG
        - X86_SLP_S3_N
        - X86_SLP_S5_N
        - X86_VR_PG
