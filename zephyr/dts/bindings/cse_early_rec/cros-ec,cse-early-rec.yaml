description: |
  Driver code to set the CSE early recovery GPIO. This signal is read by AP FW
  on Intel systems during early boot phases to anticipate recovery mode entry.

compatible: "cros-ec,cse-early-rec"

include: base.yaml

properties:
  cse-early-rec-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO pin connected to the EC_SOC_REC_SWITCH_OD (aka CSE_EARLY_REC_SW)
      signal on the platform. Board should configure the active level such that
      logically asserting the GPIO indicates recovery mode.
