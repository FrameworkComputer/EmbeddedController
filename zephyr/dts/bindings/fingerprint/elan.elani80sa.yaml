description: ELANI80SA fingerprint sensor

compatible: "elan,elani80sa"

include: [spi-device.yaml]

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      This property specifies the connection for sensor interrupt.

  reset-gpios:
    type: phandle-array
    required: true
    description: |
      This property specifies the connection for sensor reset.

  base-image:
    type: phandle
    description: |
      Phandle to a partition storing the fingerprint sensor's base image.

  ft-info:
    type: phandle
    description: |
      Phandle to a partition with the Factory Test information.
