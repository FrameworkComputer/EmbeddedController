description: Intel RVP Board id

compatible: "intel,rvp-board-id"

include: base.yaml

properties:
  bom-gpios:
    type: phandle-array
    description: |
     A list contains GPIO pins corresponding to BOM ID bits.

  fab-gpios:
    type: phandle-array
    description: |
     A list contains GPIO pins corresponding to FAB ID bits.

  board-gpios:
    type: phandle-array
    required: true
    description: |
     A list contains GPIO pins corresponding to BOARD ID bits.

  defer-until-s5:
    type: phandle
    description: |
     Define the IOEX device node which needs to be deferred
     until EC boots to S5 for RVP, as the power rail to the
     IOEX comes up in S5 state.

  handler:
    type: string
    description: |
     The C function name to call as a notification event when the board
     ID is available.
