# atriarvp-rtk board-specific Kconfig settings.

CONFIG_BOARD_ATRIARVP_RTK=y

# This is appropriate for an RVP
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y

# eSPI
CONFIG_ESPI_PERIPHERAL_EC_HOST_CMD=y
CONFIG_ESPI_PERIPHERAL_ACPI_SHM_REGION=y
# FIXME: This config is not defined for RTS5912 upstream; how does removing this
# break the ESPI shim?
CONFIG_ESPI_PERIPHERAL_CUSTOM_OPCODE=y
