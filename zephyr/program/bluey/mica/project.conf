# mica board-specific Kconfig settings.

CONFIG_BOARD_MICA=y

CONFIG_GOOGLE_PRIVATE=y

# Fan
CONFIG_PLATFORM_EC_NUM_FANS=2
CONFIG_PLATFORM_EC_CUSTOM_FAN_DUTY_CONTROL=y

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_STRICT_DEBOUNCE=y

# Clock
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=25000000

# Uart
CONFIG_UART_NPCX_USE_MDMA=y
