# JUCHI variant Kconfig settings.
CONFIG_BOARD_JUCHI=y

CONFIG_PDC_POWER_MGMT_SRC_PDO_PEAK_OCP_110=y

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_CUSTOMIZATION=y
CONFIG_PLATFORM_EC_KEYBOARD_FACTORY_TEST=y
CONFIG_PLATFORM_EC_KEYBOARD_KEYPAD=y
CONFIG_PLATFORM_EC_KEYBOARD_STRAUSS=y
CONFIG_PLATFORM_EC_KEYBOARD_COLS=18

# Fan
CONFIG_PLATFORM_EC_CUSTOM_FAN_CONTROL=y

# Motionsense Sensor
CONFIG_PLATFORM_EC_ACCEL_LIS2DE=y
CONFIG_PLATFORM_EC_DYNAMIC_MOTION_SENSOR_COUNT=n
CONFIG_PLATFORM_EC_GMR_TABLET_MODE=y

# Battery
CONFIG_PLATFORM_EC_SMBUS_PEC=y
CONFIG_PLATFORM_EC_I2C_NACK_RETRY_COUNT=10
CONFIG_PLATFORM_EC_BATTERY_INIT_TYPE_RETRY_COUNT=10
