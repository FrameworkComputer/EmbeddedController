CONFIG_PLATFORM_EC=y
CONFIG_CROS_EC=y
CONFIG_SHIMMED_TASKS=y
CONFIG_SYSCON=y
CONFIG_ASSERT=y

# Not sure what overrides the default in zephyr/app/ec/Kconfig. We shouldn't have to override it here
CONFIG_NUM_PREEMPT_PRIORITIES=28
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=27

CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_PLATFORM_EC_CUSTOMIZED_DESIGN=y
CONFIG_PLATFORM_EC_HOST_EVENT64=y
CONFIG_PLATFORM_EC_SWITCH=y
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y
CONFIG_PLATFORM_EC_WP_DISABLE=y
CONFIG_PLATFORM_EC_UNIMPLEMENTED_GPIO=y
CONFIG_PLATFORM_EC_I2C_DEBUG=y
CONFIG_CROS_EC_RW_SIZE=0x3F000

# Port80
CONFIG_PLATFORM_EC_PORT80_4_BYTE=y
CONFIG_ESPI_NPCX_PERIPHERAL_DEBUG_PORT_80_MULTI_BYTE=y
CONFIG_PLATFORM_EC_PORT80_CUSTOM_FORMAT=y

# Host interface
CONFIG_ESPI=y
CONFIG_ESPI_NPCX_PERIPHERAL_ACPI_SHD_MEM_SIZE=512
CONFIG_ESPI_PERIPHERAL_ACPI_SHM_REGION_WRITE_PROTECT_ENABLE=n
CONFIG_ESPI_PERIPHERAL_ACPI_SHM_REGION_PORT_NUM=0xe00

# Power button and power sequencing feature.
CONFIG_AP=y
CONFIG_AP_X86_AMD=y
CONFIG_PLATFORM_EC_POWERSEQ=y
CONFIG_PLATFORM_EC_POWERSEQ_S0IX=y
CONFIG_PLATFORM_EC_POWERSEQ_AMD=n
CONFIG_PLATFORM_EC_POWERSEQ_CUSTOMER=y
CONFIG_PLATFORM_EC_POWER_BUTTON=y

# USBC
# Disable TCPC+TCPM in favor of standalone CYPD PD Controller
CONFIG_PLATFORM_EC_USBC=n
CONFIG_PLATFORM_EC_STANDALONE_PD_CHIP=y
CONFIG_PLATFORM_EC_USB_PD_CONTROLLER=y
CONFIG_PD_COMMON_VBUS_CONTROL=y
CONFIG_PLATFORM_EC_USBC_PPC=n

# Thermal
CONFIG_PLATFORM_EC_TEMP_SENSOR=y
CONFIG_PLATFORM_EC_THERMISTOR=n
CONFIG_PLATFORM_EC_THROTTLE_AP=y

# Fan
CONFIG_SENSOR=y
CONFIG_PLATFORM_EC_FAN=y
CONFIG_LTO=n

# ALS
CONFIG_PLATFORM_EC_MOTIONSENSE=n

# LED
CONFIG_PLATFORM_EC_LED_COMMON=n
CONFIG_PLATFORM_EC_LED_DT=y

# Disable default features we don't want in a minimal example.
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_CBI=n

# Others
CONFIG_PLATFORM_CHASSIS_OPEN_SWITCH=n
CONFIG_PLATFORM_PRIVACY_DEVICE_CHECK=n

# EC Power
CONFIG_PLATFORM_EC_HIBERNATE=n

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD=n

