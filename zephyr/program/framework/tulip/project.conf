CONFIG_BOARD_TULIP=y
CONFIG_PLATFORM_EC_FRAMEWORK_LAPTOP_16=y
CONFIG_PLATFORM_EC_GPU=y

# Customized
CONFIG_PLATFORM_EC_CDECK_POWER_CONTROL=y
CONFIG_PLATFORM_EC_GPU_POWER_CONTROL=y

# Host interface
CONFIG_ESPI_VWIRE_INDEX_33H=y
CONFIG_PLATFORM_EC_AMD_SB_RMI=y
CONFIG_PLATFORM_EC_SCI_GPIO=y

# Fan
CONFIG_PLATFORM_EC_NUM_FANS=2
CONFIG_PLATFORM_EC_CUSTOM_FAN_DUTY_CONTROL=y
CONFIG_PLATFORM_EC_CUSTOM_FAN_CONTROL=y

#TypeC support
CONFIG_PLATFORM_EC_USBC=n
CONFIG_PLATFORM_EC_USB_POWER_DELIVERY=n
CONFIG_PLATFORM_EC_USB_PD_DISCHARGE=n
CONFIG_PLATFORM_EC_PD_CHIP_MAX_COUNT=3

# Charger
CONFIG_PLATFORM_EC_CHARGER_SENSE_RESISTOR=10
CONFIG_PLATFORM_EC_CHARGER_SENSE_RESISTOR_AC=10
CONFIG_PLATFORM_EC_CHARGER_BQ25710_SENSE_RESISTOR_AC=5
CONFIG_PLATFORM_EC_CHARGER_DEFAULT_CURRENT_LIMIT=500
CONFIG_PLATFORM_EC_CHARGER_MIN_POWER_MW_FOR_POWER_ON=55000
CONFIG_PLATFORM_EC_CHARGER_DISCHARGE_ON_AC_CUSTOM=y
CONFIG_PLATFORM_EC_USB_PD_VBUS_MEASURE_CHARGER=y
CONFIG_PLATFORM_EC_CHARGER_MAINTAIN_VBAT=y
CONFIG_PLATFORM_EC_CHARGER_ISL9241=n
CONFIG_PLATFORM_EC_CHARGER_BQ25770=y
CONFIG_PLATFORM_EC_CHARGER_RAA489300=y
CONFIG_PLATFORM_EC_CHARGER_HAS_VOLTAGE_REGULATOR=y
#CONFIG_PLATFORM_EC_USB_PD_VBUS_MEASURE_BY_BOARD=y TODO add INA vbus measurements
# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD=n
CONFIG_ESPI_PERIPHERAL_8042_KBC=n

# Thermal
CONFIG_PLATFORM_EC_TEMP_SENSOR_F75303=n
CONFIG_PLATFORM_EC_FAN_RPM_CUSTOM=y
CONFIG_PLATFORM_EC_TEMP_SENSOR_SB_TSI=y
CONFIG_PLATFORM_EC_AMD_STT=y

# Project
CONFIG_CHIPSET_AMD=y
CONFIG_PD_CHIP_CCG8=y
CONFIG_PD_CCG8_EPR=y
CONFIG_PD_CCG8_CUSTOMIZE_BATT_MESSAGE=y
