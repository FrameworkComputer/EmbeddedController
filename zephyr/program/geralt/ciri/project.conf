# Variant config
CONFIG_BOARD_CIRI=y

# Sensor Drivers
CONFIG_PLATFORM_EC_ACCELGYRO_LSM6DSM=y

# Tablet mode config
CONFIG_PLATFORM_EC_GMR_TABLET_MODE=n

# USB Config
CONFIG_PLATFORM_EC_USB_PD_3A_PORTS=0
CONFIG_PLATFORM_EC_USB_PD_MAX_POWER_MW=45000

# thermal solution
CONFIG_PLATFORM_EC_CHARGER_PROFILE_OVERRIDE=y

# remove debug options for fw qual
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=n
CONFIG_PLATFORM_EC_BRINGUP=n

# Battery config
CONFIG_PLATFORM_EC_I2C_VIRTUAL_BATTERY_ADDR=0x0f

# memory and performance optimizations
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_MINIMAL=y
CONFIG_KERNEL_SHELL=n
CONFIG_SOC_IT8XXX2_SWITCH_IN_RAM=y
CONFIG_I2C_CODE_IN_RAM=y
CONFIG_ESPI_IT8XXX2_H2RAM_SHARED=y
CONFIG_PLATFORM_EC_SOC_IT8XXX2_CONSOLE_BUF_H2RAM_SHARED=y

# ADC Config
CONFIG_ADC_IT8XXX2_READING_TIMEOUT_MS=100
