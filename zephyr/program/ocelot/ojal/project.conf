# ojal board-specific Kconfig settings.

CONFIG_BOARD_OJAL=y

# eSPI
CONFIG_ESPI_PERIPHERAL_EC_HOST_CMD=y
CONFIG_ESPI_PERIPHERAL_ACPI_SHM_REGION=y
CONFIG_ESPI_PERIPHERAL_CUSTOM_OPCODE=y

# Charger
CONFIG_PLATFORM_EC_CHARGER_RAA489110=n
CONFIG_PLATFORM_EC_CHARGER_ISL9238C=y
CONFIG_PLATFORM_EC_CHARGER_SENSE_RESISTOR=10
CONFIG_PLATFORM_EC_CHARGER_SENSE_RESISTOR_AC=20
CONFIG_PLATFORM_EC_USB_PD_VBUS_MEASURE_PDC=y
CONFIG_PLATFORM_EC_EXTPOWER_GPIO=y
CONFIG_PLATFORM_EC_DEDICATED_CHARGE_PORT=n

# Battery support
CONFIG_PLATFORM_EC_BATTERY_PRESENT_NONE=y
CONFIG_PLATFORM_EC_BATTERY_CUT_OFF=y
CONFIG_PLATFORM_EC_BATTERY_FUEL_GAUGE=y
CONFIG_PLATFORM_EC_BATTERY_REVIVE_DISCONNECT=y

# Disable options not yet configured
CONFIG_PWM=n
CONFIG_PLATFORM_EC_KEYBOARD=n
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_BUTTON=n
CONFIG_UCSI_PPM=n
CONFIG_PLATFORM_EC_MKBP_EVENT=n
CONFIG_PLATFORM_EC_MKBP_INPUT_DEVICES=n
CONFIG_PLATFORM_EC_MKBP_USE_GPIO_AND_HOST_EVENT=n
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y
