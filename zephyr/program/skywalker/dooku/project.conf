CONFIG_BOARD_DOOKU=y

# USBC
CONFIG_BOARD_SKYWALKER_SINGLE_USB_TYPEC=y
CONFIG_PLATFORM_EC_USB_PD_MAX_VOLTAGE_MV=15000
CONFIG_PLATFORM_EC_USB_PD_MAX_CURRENT_MA=3000
CONFIG_PLATFORM_EC_USB_PD_MAX_POWER_MW=45000

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_KEYPAD=y
CONFIG_PLATFORM_EC_KEYBOARD_FACTORY_TEST=y

# Keyboard Backlight
CONFIG_PLATFORM_EC_KBLIGHT_HOOK_INIT=y

# Battery
CONFIG_PLATFORM_EC_BATTERY_INIT_TYPE_RETRY_COUNT=10
CONFIG_PLATFORM_EC_BATTERY_REVIVE_DISCONNECT=y

# Charger
CONFIG_PLATFORM_EC_CHARGER_INPUT_CURRENT_DERATE_PCT=2

# System lock
CONFIG_PLATFORM_EC_BRINGUP=n
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=n

# volume button
CONFIG_PLATFORM_EC_VOLUME_BUTTONS=n

# sensor configs
CONFIG_PLATFORM_EC_ACCEL_FIFO=n
CONFIG_PLATFORM_EC_SENSOR_TIGHT_TIMESTAMPS=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCELS=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCEL_INFO=n

# GMR
CONFIG_PLATFORM_EC_TABLET_MODE=n
CONFIG_PLATFORM_EC_TABLET_MODE_SWITCH=n
CONFIG_PLATFORM_EC_GMR_TABLET_MODE=n

# Config HOOK_TICK interval
CONFIG_CROS_EC_HOOK_TICK_INTERVAL=125000
