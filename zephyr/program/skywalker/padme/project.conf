CONFIG_BOARD_PADME=y

# sensor configs
CONFIG_PLATFORM_EC_ACCELGYRO_BMI3XX=y
CONFIG_PLATFORM_EC_ACCELGYRO_BMI_COMM_I2C=y
CONFIG_PLATFORM_EC_ACCELGYRO_LSM6DSM=y
CONFIG_PLATFORM_EC_SENSOR_EC_RATE_FORCE_MODE=y

#ADC
CONFIG_ADC_IT8XXX2_VOL_FULL_SCALE=y

# battery
CONFIG_PLATFORM_EC_BATTERY_CUTOFF_RETRY_COUNT=10
CONFIG_PLATFORM_EC_BATT_HOST_FULL_FACTOR=99
CONFIG_PLATFORM_EC_I2C_NACK_RETRY_COUNT=10
CONFIG_PLATFORM_EC_I2C_VIRTUAL_BATTERY_ADDR=0x0f
CONFIG_PLATFORM_EC_SMART_BATTERY_OPTIONAL_MFG_FUNC=y

# Button
CONFIG_PLATFORM_EC_CMD_BUTTON=y
CONFIG_PLATFORM_EC_BUTTON_TRIGGERED_RECOVERY=y

# Charger
CONFIG_PLATFORM_EC_CHARGER_PROFILE_OVERRIDE=y

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_PROTOCOL_MKBP=y
CONFIG_PLATFORM_EC_KEYBOARD_COL2_INVERTED=y
CONFIG_PLATFORM_EC_KEYBOARD_STRAUSS=y
CONFIG_PLATFORM_EC_KEYBOARD_COLS=18

# pdc
CONFIG_BOARD_SKYWALKER_SINGLE_USB_TYPEC=y
CONFIG_PLATFORM_EC_USB_PD_3A_PORTS=0
CONFIG_PLATFORM_EC_USB_PD_MAX_CURRENT_MA=3000
CONFIG_PLATFORM_EC_USB_PD_MAX_POWER_MW=45000
CONFIG_PLATFORM_EC_USB_PD_MAX_VOLTAGE_MV=15000
CONFIG_PLATFORM_EC_CHARGER_MIN_POWER_MW_FOR_POWER_ON=15001
CONFIG_PDC_RUNTIME_PORT_CONFIG=y

# Detachable
CONFIG_PLATFORM_EC_DETACHABLE_BASE=y
CONFIG_PLATFORM_EC_BASE_ATTACHED_SWITCH=y

# Uart
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_TARGET_BUFFER_MODE=y
CONFIG_I2C_TARGET_IT8XXX2_MAX_BUF_SIZE=2044
CONFIG_PLATFORM_EC_ONE_WIRE_UART_TABLET=y

# Wpc
CONFIG_HAS_TASK_PCHG=y
CONFIG_PLATFORM_EC_PERIPHERAL_CHARGER=y
CONFIG_PLATFORM_EC_CPS8100=y
CONFIG_PLATFORM_EC_WPC_HALL_ENABLE=y

# System lock
CONFIG_PLATFORM_EC_BRINGUP=n
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=n
CONFIG_USBC_LOG_LEVEL_ERR=y
