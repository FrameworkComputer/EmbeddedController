CONFIG_BOARD_ULDRENITE=y

# Fix compile issue
CONFIG_CROS_EC_RAM_BASE=0xff216900
CONFIG_CROS_EC_RAM_SIZE=0x00090000
CONFIG_CROS_EC_DATA_RAM_SIZE=0x00010000
CONFIG_CROS_EC_PROGRAM_MEMORY_BASE=0x10090000
CONFIG_CROS_EC_RO_MEM_OFF=0x0
CONFIG_CROS_EC_RO_SIZE=0xb000
CONFIG_CROS_EC_RW_MEM_OFF=0xb000
CONFIG_CROS_EC_RW_SIZE=0x75000

CONFIG_PLATFORM_EC=y
CONFIG_CROS_EC=y
CONFIG_SHIMMED_TASKS=y
CONFIG_SYSCON=y

# Disable default features
CONFIG_COMMON_LIBC_MALLOC=n

# Log
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PIGWEED_LOG_ZEPHYR=y
CONFIG_LOG_PRINTK=n

# Host Interface and  MKBP event
CONFIG_PLATFORM_EC_HOST_INTERFACE_HECI=y
CONFIG_PLATFORM_EC_MKBP_EVENT=y
CONFIG_PLATFORM_EC_MKBP_USE_HECI=y
CONFIG_HECI_LOG_LEVEL_ERR=y

# ISH BSP config
CONFIG_IPM=y
CONFIG_HECI=y
CONFIG_HOST_SERVICE=y
CONFIG_HECI_INTF_IPM=y
CONFIG_REBOOT=y
CONFIG_SPI=n
CONFIG_GPIO=y

#Sensor
CONFIG_PLATFORM_EC_MOTIONSENSE=y
CONFIG_PLATFORM_EC_ACCEL_LIS2DW12=y
CONFIG_PLATFORM_EC_ACCELGYRO_LSM6DSM=y
CONFIG_PLATFORM_EC_ACCEL_FIFO=y
CONFIG_PLATFORM_EC_LID_ANGLE=y
CONFIG_PLATFORM_EC_LID_ANGLE_UPDATE=y
CONFIG_PLATFORM_EC_DYNAMIC_MOTION_SENSOR_COUNT=y
CONFIG_PLATFORM_EC_BODY_DETECTION_DYNAMIC_INDEX=y
CONFIG_PLATFORM_EC_SENSOR_TIGHT_TIMESTAMPS=y
CONFIG_PLATFORM_EC_GMR_TABLET_MODE=n
CONFIG_PLATFORM_EC_TABLET_MODE=y
CONFIG_PLATFORM_EC_TABLET_MODE_SWITCH=n
CONFIG_PLATFORM_EC_LID_SWITCH=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCELS=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCEL_INFO=y
CONFIG_PLATFORM_EC_SENSOR_EC_RATE_FORCE_MODE=y
CONFIG_PLATFORM_EC_ACCEL_SPOOF_MODE=y

# Body detection configuration
CONFIG_PLATFORM_EC_BODY_DETECTION=y
CONFIG_BODY_DETECTION_ALOGIRTHM_V2=y
CONFIG_PLATFORM_EC_BODY_DETECTION_ALWAYS_ENABLE_IN_S0=y
CONFIG_PLATFORM_EC_GESTURE_HOST_DETECTION=y

#ISH PM
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=n
CONFIG_GDT_DYNAMIC=y
CONFIG_GDT_RESERVED_NUM_ENTRIES=3
CONFIG_PLATFORM_EC_CONSOLE_CMD_SLEEPMASK=n

# Other
CONFIG_SHELL_PROMPT_UART="ish:~$ "
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=n
CONFIG_SHELL_BACKEND_SERIAL_RX_POLL_PERIOD=60000

# Notify EC for clamshell/tablet mode change
CONFIG_EVENTS=y
CONFIG_DSP_COMMS_LOG_LEVEL_ERR=y
CONFIG_PLATFORM_EC_DSP_REMOTE_BODY_DETECTION=y
CONFIG_PLATFORM_EC_DSP_REMOTE_CBI=y
CONFIG_PLATFORM_EC_DSP_REMOTE_LID_ANGLE=y
CONFIG_PLATFORM_EC_DSP_REMOTE_LID_SWITCH=y
CONFIG_PLATFORM_EC_DSP_REMOTE_TABLET_SWITCH=y
