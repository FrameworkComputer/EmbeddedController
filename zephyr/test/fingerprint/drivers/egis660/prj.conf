CONFIG_ZTEST=y
CONFIG_EMUL=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PM_DEVICE=y
CONFIG_FINGERPRINT_SENSOR=y
CONFIG_FINGERPRINT_SENSOR_EGIS660_PAL=y
CONFIG_APPLICATION_DEFINED_SYSCALL=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Platform EC support
CONFIG_PLATFORM_EC=y
CONFIG_CROS_EC=y
CONFIG_CROS_EC_FIRMWARE_LOAD_OFF=0x0
CONFIG_CROS_EC_RO=y
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_SWITCH=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_CHARGEN=n
CONFIG_PLATFORM_EC_PANIC=n

# Flash testing with cros-ec,flash-emul
CONFIG_FLASH=y
CONFIG_EMUL_CROS_FLASH=y
CONFIG_PLATFORM_EC_FLASH_SIZE_BYTES=0x200000
