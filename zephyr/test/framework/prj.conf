# Test framework
CONFIG_ZTEST=y

# Emulation support for GPIO testing
CONFIG_EMUL=y
CONFIG_GPIO_EMUL=y

# EC platform basics
CONFIG_CROS_EC=y
CONFIG_PLATFORM_EC=y

# Disable USB-C subsystem - not needed for this test
CONFIG_PLATFORM_EC_USBC=n
# Select controller mode instead of TCPMV2 (choice requires one option)
CONFIG_PLATFORM_EC_USB_PD_CONTROLLER=y
CONFIG_PLATFORM_EC_USB_PD_TCPMV2=n
CONFIG_PLATFORM_EC_USBC_PPC=n
CONFIG_PLATFORM_EC_TCPC_INTERRUPT=n
# Disable I2C to avoid named-i2c-ports assertion
CONFIG_PLATFORM_EC_I2C=n
