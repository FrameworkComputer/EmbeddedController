common:
  platform_allow:
    - native_sim
tests:
  jump_data.default:
    extra_configs:
      - CONFIG_PLATFORM_EC_PRESERVED_END_OF_RAM_SIZE=1024
    tags:
      - common
      - system
  jump_data.rw:
    extra_configs:
      - CONFIG_PLATFORM_EC_PRESERVED_END_OF_RAM_SIZE=1024
    extra_args:
      - EXTRA_CFLAGS=-DSECTION_IS_RW
    tags:
      - common
      - system
